{% extends 'base.html' %}
{% block content %}
<h1>Категории</h1>

<form method="post" action="{{ url_for('admin_category_add') }}" class="admin-form">
    <input type="text" name="name" placeholder="Название" required>
    <input type="text" name="description" placeholder="Описание">
    <button type="submit" class="btn">Добавить</button>
</form>

<table class="admin-table">
    <tr><th>ID</th><th>Название</th><th>Slug</th><th>Товаров</th><th>Действия</th></tr>
    {% for c in categories %}
    <tr>
        <td>{{ c.id }}</td>
        <td>
            <form method="post" action="{{ url_for('admin_category_edit', cid=c.id) }}" style="display:flex;gap:8px">
                <input type="text" name="name" value="{{ c.name }}" required>
                <input type="text" name="description" value="{{ c.description or '' }}">
                <button type="submit">💾</button>
            </form>
        </td>
        <td>{{ c.slug }}</td>
        <td>{{ c.products|length }}</td>
        <td>
            <form method="post" action="{{ url_for('admin_category_delete', cid=c.id) }}"
                  onsubmit="return confirm('Удалить категорию со всеми товарами?')">
                <button type="submit" class="danger">🗑</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
